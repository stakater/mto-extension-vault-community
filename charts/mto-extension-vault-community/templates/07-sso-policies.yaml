{{- if include "vault.componentEnabled" (dict "component" "core" "ctx" .) }}
{{/*
Section 7 — one SSO Vault role + policy per (tenant, role). For each role in
sso.roles:
  - Policy sso.<tenant>.<role>, granting that role's KV access across the
    tenant's mount <tenant>/kv, and nothing else (the scope check).
  - JWTOIDCAuthEngineRole sso.<tenant>.<role> on the tenant's
    auth/<tenant>/oidc/sso mount, bound to exactly the groups claim
    "<tenant>-<role>s" (or whatever sso.tenantGroupTemplate renders to).

sso.allowedRedirectUris entries may hold {tenant}: each tenant's mount has its
own UI callback, /ui/vault/auth/<tenant>/oidc/sso/oidc/callback, and Vault
Community has no namespace_in_state to make it one URL for all.

There is no fallback role. A role without a group binding gives any valid OIDC
token that role, and on Community Edition nothing outside the policy contains
it: sso.tenantRoleMapping.fallback must be "deny".

Every Vault role accepts the audience sso.oidc.clientId. An OIDC ID token's
`aud` always holds the client ID it was issued to (Dex puts only that there),
so the audience is not a second value to keep in step: a separate sso.audience
that differed from the client ID refused every login.

Role ladder (most → least privilege):
  admin        KV CRUD + delete/undelete/destroy
  editor       KV create/read/update/patch/list
  viewer       KV read/list
  audit-read   KV metadata list only; no data reads
*/}}
{{- if include "vault.on" (dict "name" "sso.enabled" "value" .Values.sso.enabled) }}
{{- /* Every role below is roleType=oidc, for which Vault requires a non-empty
       allowed_redirect_uris, and the CRD marks allowedRedirectURIs required.
       Emptied in values, it would render as YAML null and fail the whole
       tenant's TemplateInstance apply — not just SSO. */ -}}
{{- if not .Values.sso.allowedRedirectUris }}
{{- fail "sso.enabled=true requires at least one entry in sso.allowedRedirectUris — Vault rejects an oidc role with no allowed_redirect_uris, so every SSO login would be unusable" }}
{{- end }}
{{- $tenant := required ".Values.tenant must be set by the parent" .Values.tenant }}
{{- $env := .Values.env }}
{{- $labels := include "vault.labels" . }}
{{- $ssoMount := include "vault.ssoMount" . }}
{{- $kv := printf "%s/kv" $tenant }}
{{- $fallback := toString (dig "tenantRoleMapping" "fallback" "deny" $.Values.sso) }}
{{- if ne $fallback "deny" }}
{{- fail (printf "sso.tenantRoleMapping.fallback=%q: a fallback role binds no group, so any valid OIDC token of the IdP would get tenant %s's %s access. Vault Community has no namespace to contain it. Set it to \"deny\" (the default)" $fallback $tenant $fallback) }}
{{- end }}
{{- $redirects := list }}
{{- range $uri := $.Values.sso.allowedRedirectUris }}
{{- $redirects = append $redirects (replace "{tenant}" $tenant (toString $uri)) }}
{{- end }}
{{- if not .Values.sso.roles }}
{{- fail "sso.enabled=true with an empty sso.roles: the tenant would get an OIDC mount and no role to log in with. Remove sso.roles to use the chart's roles" }}
{{- end }}
{{- /* Vault refuses an SSO role whose ttl is over its max ttl; 0 is Vault's
       default and is not compared. */ -}}
{{- $sttl := include "vault.durationSeconds" (dict "name" "ssoToken.ttl" "value" .Values.ssoToken.ttl) }}
{{- $smax := include "vault.durationSeconds" (dict "name" "ssoToken.maxTTL" "value" .Values.ssoToken.maxTTL) }}
{{- if and (gt (float64 $smax) 0.0) (gt (float64 $sttl) (float64 $smax)) }}
{{- fail (printf "ssoToken.ttl %q is over ssoToken.maxTTL %q: Vault refuses an SSO role whose ttl is over its max ttl, so every SSO login of the tenant would fail" (toString .Values.ssoToken.ttl) (toString .Values.ssoToken.maxTTL)) }}
{{- end }}
{{- $groups := dict }}
{{- range $role := $.Values.sso.roles }}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" (toString $role)) }}{{ fail (printf "sso.roles entry %q is not a DNS label — it is a part of the dot-joined Vault role name sso.<tenant>.<role>" $role) }}{{ end }}
{{- if eq (toString $role) "fallback" }}{{ fail "sso.roles entry \"fallback\" is reserved: sso.<tenant>.fallback is the name of Enterprise's Vault role without a group binding (sso.tenantRoleMapping.fallback), which this chart never renders, and a role of that name would read as one. Rename the role" }}{{ end }}
{{- $caps := index $.Values.roleCaps $role }}
{{- if not $caps }}{{ fail (printf "sso.roles includes %q but roleCaps has no entry for it" $role) }}{{ end }}
{{- $roleName := include "vault.ssoRoleName" (dict "tenant" $tenant "role" $role) }}
{{- $group := include "vault.ssoGroup" (dict "tenant" $tenant "role" $role
                                               "mapping" $.Values.sso.tenantRoleMapping
                                               "defaultTemplate" $.Values.sso.tenantGroupTemplate) }}
{{- /* One group per role: a group bound to two roles gets both, which makes
       the lower role meaningless ({tenant} alone gives one group all four). */ -}}
{{- if hasKey $groups $group }}{{ fail (printf "sso: roles %s and %s of tenant %s bind the same group %q: its members would get both. Give each role its own group" (get $groups $group) $role $tenant $group) }}{{ end }}
{{- $_ := set $groups $group $role }}
{{- $policy := list (printf "# SSO role %s for tenant %s." $role $tenant) }}
{{- /* The mount root, on its own line because <tenant>/kv/metadata/<env>/*
       does NOT match <tenant>/kv/metadata — a prefix glob never covers the
       prefix itself. Without it the web UI's secrets browser is refused on
       its first request and shows an empty tree for every role. */ -}}
{{- $policy = append $policy (printf "path \"%s/metadata\" { capabilities = [\"list\"] }" $kv) }}
{{- if eq $role "audit-read" }}
{{- $policy = append $policy (printf "path \"%s/metadata/%s/*\" { capabilities = [\"list\"] }" $kv $env) }}
{{- else }}
{{- $policy = append $policy (printf "path \"%s/data/%s/*\"     { capabilities = %s }" $kv $env $caps) }}
{{- $policy = append $policy (printf "path \"%s/metadata/%s/*\" { capabilities = %s }" $kv $env $caps) }}
{{- end }}
{{- if eq $role "admin" }}
{{- $policy = append $policy (printf "path \"%s/delete/%s/*\"   { capabilities = [\"update\"] }" $kv $env) }}
{{- $policy = append $policy (printf "path \"%s/undelete/%s/*\" { capabilities = [\"update\"] }" $kv $env) }}
{{- $policy = append $policy (printf "path \"%s/destroy/%s/*\"  { capabilities = [\"update\"] }" $kv $env) }}
{{- end }}
{{- $body := join "\n" $policy }}
{{- include "vault.assertPolicyScope" (dict "name" $roleName "policy" $body "ctx" $) }}
---
apiVersion: redhatcop.redhat.io/v1alpha1
kind: Policy
metadata:
  name: {{ $roleName }}
  namespace: {{ $.Values.configNamespace | quote }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  {{- include "vault.vcoAuth" $ | nindent 2 }}
  name: {{ $roleName }}
  policy: |
    {{- $body | nindent 4 }}
---
apiVersion: redhatcop.redhat.io/v1alpha1
kind: JWTOIDCAuthEngineRole
metadata:
  name: {{ $roleName }}
  namespace: {{ $.Values.configNamespace | quote }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  {{- include "vault.vcoAuth" $ | nindent 2 }}
  name: {{ $roleName }}
  path: {{ $ssoMount }}
  roleType: oidc
  userClaim: email
  groupsClaim: groups
  OIDCScopes:
    - email
    - profile
    - groups
  boundAudiences:
    - {{ $.Values.sso.oidc.clientId | quote }}
  boundClaims:
    groups:
      - {{ $group | quote }}
  tokenPolicies:
    - {{ $roleName }}
  allowedRedirectURIs:
    {{- range $uri := $redirects }}
    - {{ $uri | quote }}
    {{- end }}
  {{- if $.Values.ssoToken.ttl }}
  tokenTTL: {{ $.Values.ssoToken.ttl | quote }}
  {{- end }}
  {{- if $.Values.ssoToken.maxTTL }}
  tokenMaxTTL: {{ $.Values.ssoToken.maxTTL | quote }}
  {{- end }}
{{- end }}

{{- end }}
{{- end }}
