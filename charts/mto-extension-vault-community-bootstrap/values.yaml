# mto-extension-vault-community-bootstrap values.
#
# Cluster-level wiring for the Vault Community Edition / MTO integration.
# Renders once per cluster — the parent watches MTO Tenant CRs, renders every
# tenant's KV mount <tenant>/kv, and fans out to one child TemplateInstance per
# Tenant (plus one per enabled optional slice).
#
# Vault Community has no namespaces. A tenant is a path prefix: its KV mount
# <tenant>/kv and its auth mounts auth/<tenant>/..., in Vault's one namespace.

# The Kubernetes namespace that holds every Template, TemplateInstance and VCO
# CR this integration renders, and the ServiceAccount below. Install this chart
# into it.
configNamespace: vault-config

# How every rendered VCO CR logs in to Vault: kubernetes auth at `authPath`,
# with `role`, as the ServiceAccount `serviceAccount` in configNamespace. This
# chart creates the ServiceAccount; the Vault side (auth mount, role, policy)
# is a one-time Vault-admin step — see charts/README.md → "Vault bootstrap".
# The first segment of authPath is a reserved tenant name: a tenant's auth
# mounts start with its name, and Vault refuses an auth mount nested under
# another.
vco:
  authPath: kubernetes
  role: vco-admin
  serviceAccount: vco-admin

# The kubernetes auth mount workloads log in with, one per tenant: VCO mounts
# it at auth/<tenant>/<path>/<name>, for example auth/team-a/kubernetes/workloads.
# The tenant's share roles live on it too (ADR-0007).
kubernetesAuth:
  path: kubernetes
  name: workloads
  kubernetesHost: https://kubernetes.default.svc:443
  # Empty (default): Vault reviews tokens with its own ServiceAccount, bound to
  # system:auth-delegator — no reviewer credential is stored. Set only when
  # Vault runs outside this cluster.
  tokenReviewerServiceAccount: ""

# t-op-v2 install identity. The RBAC in this chart binds to the t-op-v2
# controller's ServiceAccount; defaults match `helm install template-operator`
# of the upstream chart.
templateOperator:
  serviceAccountName: template-operator-template-operator-v2
  namespace: stakater-template-operator

# The mto-extension-vault-community chart that t-op-v2 pulls per MTO Tenant at
# render time. Bump `version` to roll the per-tenant config shape.
tenantChart:
  # oci://… or an http(s) chart repository URL.
  registry: oci://ghcr.io/stakater/charts
  name: mto-extension-vault-community
  version: 0.1.0
  releaseName: mto-extension-vault-community
  # Optional: a Secret (in configNamespace) with registry credentials.
  # Shapes (per t-op-v2): {username,password} | {token} | {.dockerconfigjson}.
  authSecretName: ""

# Parent Template defaults — passed through to every child TI.
parent:
  env: dev
  vaultServer: http://vault.vault.svc.cluster.local:8200
  tenantLabelKey: stakater.com/tenant
  # The prefix of the shared mount shared/kv, where cross-tenant shares land.
  # A reserved tenant name.
  sharedTenantName: shared
  # Tenant names the parent skips because the platform already uses them as
  # the first segment of a secrets or auth mount. Vault refuses a mount nested
  # under another, and the parent cannot read Vault's mount tables, so the
  # platform lists them here. sys, auth, identity, cubbyhole, agent-registry,
  # token, the shared name and the first segment of vco.authPath are always
  # reserved, in addition to this list.
  reservedPaths:
    - secret
    - kv
    - pki
    - transit
    - database
    - ssh
    - totp
    - oidc
    - jwt
    - userpass
    - approle
    - ldap
  eso: enabled
  externalSecretRefreshInterval: "1h"
  # Workload token settings (tenant chart value `token`), integer seconds.
  # Install-wide. Empty = the tenant chart's own defaults. period is not
  # exposed: Vault ignores it on a batch token.
  token: {}
  #  type: batch
  #  ttl: 900
  #  maxTTL: 3600
  sso:
    enabled: false
    issuerUrl: ""
    # Tenant chart sso.allowedRedirectUris. Empty = the tenant chart default
    # (the Vault CLI's loopback listener). Set the real console callback for
    # browser logins.
    allowedRedirectUris: []

# Install-wide values for the tenant chart, merged as given into every tenant's
# render. t-op-v2 pulls the PUBLISHED tenant chart, so this is the only way to
# set a tenant chart value — editing the tenant chart's own values.yaml has no
# effect on a cluster. Keys this chart already sets (tenant, env, vaultServer,
# eso, vco, kubernetesAuth, token, sso.enabled, sso.oidc.issuerUrl,
# sso.allowedRedirectUris, …) fail the render, naming the value to use instead.
tenantValues: {}
#  vaultCABundle: |               # Vault's CA, when it is signed by a private CA
#    -----BEGIN CERTIFICATE-----
#    ...
#  monitoring:
#    enabled: true
#  sso:
#    oidc:
#      clientId: vault
#      clientSecretRef: { name: vault-oidc-client-secret, key: client-secret }
#    roles: [admin, editor, viewer]

# Drift protection for everything the Templates render (t-op-v2 Template
# spec.sync), applied to the parent and child Templates.
#   off    — apply once per re-render; out-of-band edits persist.
#   revert — watch every rendered resource and re-apply on drift.
#   strict — revert + admission webhook blocking third-party UPDATE/DELETE.
sync:
  mode: revert
  # Field paths exempt from drift enforcement. VCO adds its own finalizer to
  # every CR it reconciles, so strict needs at least metadata.finalizers.
  ignoreFields: []

# The scope check at the API server: four ValidatingAdmissionPolicies on the
# VCO CRs in configNamespace (templates/50-admission.yaml). They are the wall
# between tenants that Vault Community does not have: VCO's own policy bounds
# names and mount types, not what a policy grants. Needs Kubernetes 1.30.
# Turn off ONLY on an older cluster, knowing that it removes the wall. Null
# (the key commented out) is the default, on; but helm upgrade --reuse-values
# keeps the old value under a null, so set true to turn it back on
# (charts/README.md, "Null and --reuse-values").
admission:
  enabled: true
