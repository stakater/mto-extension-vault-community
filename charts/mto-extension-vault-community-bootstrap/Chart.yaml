apiVersion: v2
name: mto-extension-vault-community-bootstrap
description: |
  Cluster-level bootstrap for the Vault Community Edition / MTO integration.
  Installs the t-op-v2 parent Template (one child TemplateInstance per MTO
  Tenant CR), the child Templates that pull the mto-extension-vault-community
  chart, the ServiceAccount every VCO CR logs in to Vault with, and the t-op-v2
  RBAC needed to manage TemplateInstances, VCO CRs, and the workload-side
  objects. The parent renders every tenant's KV mount <tenant>/kv, and the
  shared mount and shared auth mount for cross-tenant shares.

  Requires: multi-tenant-operator (Tenant CRD), template-operator-v2 >= 0.0.5
  (child TemplateInstances need namespaceSelector), vault-config-operator
  v1.0.3 or later, Kubernetes 1.30 or later, and Vault Community Edition 2.x.
  Vault Community has no namespaces: a tenant is a path prefix.
type: application
version: 0.1.0
appVersion: "0.1.0"
