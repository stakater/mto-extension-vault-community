# Source: mto-extension-vault-community/templates/01-tenant-scaffolding.yaml
apiVersion: redhatcop.redhat.io/v1alpha1
kind: AuthEngineMount
metadata:
  labels:
    app.kubernetes.io/instance: mto-extension-vault-community
    app.kubernetes.io/managed-by: helm-via-template-operator-v2
    app.kubernetes.io/name: mto-extension-vault-community
    app.kubernetes.io/version: 0.1.0
    helm.sh/chart: mto-extension-vault-community-0.1.0
    stakater.com/tenant: team-a
  name: team-a-kubernetes
  namespace: vault-config
spec:
  authentication:
    path: kubernetes
    role: vco-role
    serviceAccount:
      name: vco-sa
  # VCO adds its finalizer with an update that sends every config field, and
  # an unset listingVisibility goes as "", which VCO's own CRD enum refuses.
  # The CR then has no finalizer, and deleting it never deletes the mount in
  # Vault. "hidden" is Vault's default.
  config:
    listingVisibility: hidden
  name: workloads
  path: team-a/kubernetes
  type: kubernetes
---
