# Vault for the local lab: Community Edition, dev mode, in-memory, root token
# "root". Restarting vault-0 wipes every mount and policy, and the operator's
# login with them. Re-run `make lab-vault-bootstrap` after a restart.
#
# The image is set by `make lab-vault` (hashicorp/vault:$(VAULT_VERSION)).
server:
  dev:
    enabled: true
    devRootToken: root
  # Binds Vault's ServiceAccount to system:auth-delegator, so the kubernetes
  # auth method can review tokens without a stored reviewer JWT.
  authDelegator:
    enabled: true
injector:
  enabled: false
ui:
  enabled: false
