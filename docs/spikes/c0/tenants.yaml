apiVersion: redhatcop.redhat.io/v1alpha1
kind: Policy
metadata:
  name: kv.team.team-core.core
  namespace: vault-config
spec:
  authentication:
    path: kubernetes
    role: vco-admin
    serviceAccount:
      name: vco-admin
  name: kv.team.team-core.core
  policy: |
    path "team/kv/data/dev/team-core/core/*"     { capabilities = ["create", "read", "update", "patch", "delete", "list"] }
    path "team/kv/metadata/dev/team-core/core/*" { capabilities = ["create", "read", "update", "patch", "delete", "list"] }
    path "team/kv/delete/dev/team-core/core/*"   { capabilities = ["update"] }
    path "team/kv/undelete/dev/team-core/core/*" { capabilities = ["update"] }
    path "team/kv/destroy/dev/team-core/core/*"  { capabilities = ["update"] }
    path "team/kv/data/dev/_shared/from-team-core/*"     { capabilities = ["read", "list"] }
    path "team/kv/metadata/dev/_shared/from-team-core/*" { capabilities = ["create", "read", "update", "patch", "delete", "list"] }
    path "team/kv/data/dev/_shared/from-team-core/*"     { capabilities = ["create", "read", "update", "patch", "delete", "list"] }
    path "team/kv/metadata/dev/_shared/from-team-core/*" { capabilities = ["create", "read", "update", "patch", "delete", "list"] }
    path "team/kv/delete/dev/_shared/from-team-core/*"   { capabilities = ["update"] }
    path "team/kv/undelete/dev/_shared/from-team-core/*" { capabilities = ["update"] }
    path "team/kv/destroy/dev/_shared/from-team-core/*"  { capabilities = ["update"] }
---
# SSO tier policies. The spike has no identity provider, so question 4 and
# AC-ISO-9 use tokens made with these policies instead of an OIDC login.
apiVersion: redhatcop.redhat.io/v1alpha1
kind: Policy
metadata:
  name: sso.team-a.editor
  namespace: vault-config
spec:
  authentication:
    path: kubernetes
    role: vco-admin
    serviceAccount:
      name: vco-admin
  name: sso.team-a.editor
  policy: |
    path "team-a/kv/metadata" { capabilities = ["list"] }
    path "team-a/kv/data/dev/*"     { capabilities = ["create", "read", "update", "patch", "list"] }
    path "team-a/kv/metadata/dev/*" { capabilities = ["create", "read", "update", "patch", "list"] }
---
apiVersion: redhatcop.redhat.io/v1alpha1
kind: Policy
metadata:
  name: sso.team-a.admin
  namespace: vault-config
spec:
  authentication:
    path: kubernetes
    role: vco-admin
    serviceAccount:
      name: vco-admin
  name: sso.team-a.admin
  policy: |
    path "team-a/kv/metadata" { capabilities = ["list"] }
    path "team-a/kv/data/dev/*"     { capabilities = ["create", "read", "update", "patch", "delete", "list"] }
    path "team-a/kv/metadata/dev/*" { capabilities = ["create", "read", "update", "patch", "delete", "list"] }
    path "team-a/kv/delete/dev/*"   { capabilities = ["update"] }
    path "team-a/kv/undelete/dev/*" { capabilities = ["update"] }
    path "team-a/kv/destroy/dev/*"  { capabilities = ["update"] }
---
apiVersion: redhatcop.redhat.io/v1alpha1
kind: KubernetesAuthEngineRole
metadata:
  name: kv.team-a.team-a-api.web
  namespace: vault-config
spec:
  authentication:
    path: kubernetes
    role: vco-admin
    serviceAccount:
      name: vco-admin
  name: kv.team-a.team-a-api.web
  path: mto/workloads
  targetServiceAccounts: [web]
  targetNamespaces:
    targetNamespaces: [team-a-api]
  policies: [kv.team-a.team-a-api.web]
  tokenType: service
  tokenTTL: 3600
  tokenMaxTTL: 14400
---
