# What the per-tenant chart would render (design §3), by hand, for the
# acceptance fixture. The policies are the Enterprise chart's
# (templates/04-sa-own-tenant.yaml, 07-sso-policies.yaml) with one change:
# every path starts at root with the tenant mount, <tenant>/kv/, where the
# Enterprise chart starts at kv/ inside the tenant's Vault namespace.
#
# Tiers (Enterprise roleCaps): viewer ["read", "list"];
# editor ["create", "read", "update", "patch", "list"];
# admin ["create", "read", "update", "patch", "delete", "list"].
apiVersion: redhatcop.redhat.io/v1alpha1
kind: Policy
metadata:
  name: kv.team-a.team-a-api.web
  namespace: vault-config
spec:
  authentication:
    path: kubernetes
    role: vco-admin
    serviceAccount:
      name: vco-admin
  name: kv.team-a.team-a-api.web
  policy: |
    path "team-a/kv/data/dev/team-a-api/web/*"     { capabilities = ["create", "read", "update", "patch", "list"] }
    path "team-a/kv/metadata/dev/team-a-api/web/*" { capabilities = ["create", "read", "update", "patch", "list"] }
    path "team-a/kv/data/dev/_shared/from-team-a-api/*"     { capabilities = ["read", "list"] }
    path "team-a/kv/metadata/dev/_shared/from-team-a-api/*" { capabilities = ["create", "read", "update", "patch", "list"] }
    path "team-a/kv/data/dev/_shared/from-team-a-api/*"     { capabilities = ["create", "read", "update", "patch", "list"] }
    path "team-a/kv/metadata/dev/_shared/from-team-a-api/*" { capabilities = ["create", "read", "update", "patch", "list"] }
---
