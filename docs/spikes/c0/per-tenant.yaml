# C.0 question 17, end to end: every workload and share role of tenants.yaml
# and q15-shares.yaml moved to the per-tenant auth mounts, each bound by
# namespace name AND tenant label, through VCO with the type-pinned policy and
# under the admission policies of q18-admission.yaml. The parent renders the
# shared mount once (as the Enterprise parent renders the shared namespace's);
# the tenant chart renders each tenant's. The policies are unchanged.
# Run: delete the old role CRs (VCO refuses a spec.path change), apply this,
# then MOUNTS=per-tenant ./acceptance.sh.
---
apiVersion: redhatcop.redhat.io/v1alpha1
kind: AuthEngineMount
metadata: { name: team-a-kubernetes, namespace: vault-config }
spec:
  authentication: { path: kubernetes, role: vco-admin, serviceAccount: { name: vco-admin } }
  path: team-a/kubernetes
  name: workloads
  type: kubernetes
  config: { listingVisibility: hidden }
---
apiVersion: redhatcop.redhat.io/v1alpha1
kind: KubernetesAuthEngineConfig
metadata: { name: team-a-kubernetes-config, namespace: vault-config }
spec:
  authentication: { path: kubernetes, role: vco-admin, serviceAccount: { name: vco-admin } }
  path: team-a/kubernetes
  name: workloads
  kubernetesHost: https://kubernetes.default.svc:443
---
apiVersion: redhatcop.redhat.io/v1alpha1
