---
apiVersion: redhatcop.redhat.io/v1alpha1
kind: KubernetesAuthEngineRole
metadata: { name: kv.team-a.team-a-api.web, namespace: vault-config }
spec:
  authentication: { path: kubernetes, role: vco-admin, serviceAccount: { name: vco-admin } }
  name: kv.team-a.team-a-api.web
  path: team-a/kubernetes/workloads
  targetServiceAccounts: [web]
  targetNamespaces:
    targetNamespaceSelector:
      matchLabels: { kubernetes.io/metadata.name: team-a-api, stakater.com/tenant: team-a }
  policies: [kv.team-a.team-a-api.web]
  tokenType: service
  tokenTTL: 3600
